{% extends "base.html" %}
{% block title %}Add a territory — Pro Wrestling Bibliography{% endblock %}
{% block content %}

<p class="breadcrumbs"><a href="{{ url_for('add_index') }}">&laquo; Add</a></p>

<h1>Add a territory</h1>

<form class="add-form" method="post" action="{{ url_for('add_territory') }}">
  <div class="form-row">
    <label>Name <span class="req">*</span>
      <input type="text" name="name" required autofocus>
    </label>
    <label>Short name
      <input type="text" name="short_name" placeholder="WCCW, CWA…">
    </label>
  </div>

  <div class="form-row">
    <label>Region
      <input type="text" name="region" list="region-options" placeholder="Mid-South, Northeast, Japan…">
      <datalist id="region-options">
        {% for r in regions %}<option value="{{ r }}">{% endfor %}
      </datalist>
    </label>
    <label class="check">
      <input type="checkbox" name="nwa_member" value="1">
      NWA member
    </label>
  </div>

  <div class="form-row">
    <label>HQ city
      <input type="text" name="headquarters_city">
    </label>
    <label>HQ state / region
      <input type="text" name="headquarters_state">
    </label>
  </div>

  <div class="form-row">
    <label>Year founded
      <input type="number" name="year_founded" min="1900" max="2099">
    </label>
    <label>Year closed (blank if active)
      <input type="number" name="year_closed" min="1900" max="2099">
    </label>
  </div>

  <label>Promoter lineage
    <input type="text" name="promoter_lineage" placeholder="e.g., Fritz Von Erich, Ken Mantell…">
  </label>

  <label>Notes
    <textarea name="notes" rows="4"></textarea>
  </label>

  <div class="form-actions">
    <button type="submit">Save territory</button>
    <a class="clear" href="{{ url_for('territories') }}">Cancel</a>
  </div>
</form>

{% endblock %}
