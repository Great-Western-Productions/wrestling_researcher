{% extends "base.html" %}
{% block title %}Add a periodical — Pro Wrestling Bibliography{% endblock %}
{% block content %}

<p class="breadcrumbs"><a href="{{ url_for('add_index') }}">&laquo; Add</a></p>

<h1>Add a periodical</h1>

<form class="add-form" method="post" action="{{ url_for('add_periodical') }}">
  <div class="form-row">
    <label>Title <span class="req">*</span>
      <input type="text" name="title" required autofocus>
    </label>
    <label>Publisher
      <input type="text" name="publisher">
    </label>
  </div>

  <div class="form-row">
    <label>Country
      <input type="text" name="country" list="country-options">
      <datalist id="country-options">
        {% for c in countries %}<option value="{{ c }}">{% endfor %}
      </datalist>
    </label>
    <label>Language
      <input type="text" name="language" value="English">
    </label>
    <label>Frequency
      <input type="text" name="frequency" placeholder="monthly, weekly…">
    </label>
  </div>

  <div class="form-row">
    <label>Year started
      <input type="number" name="year_started" min="1900" max="2099">
    </label>
    <label>Year ended (blank if active)
      <input type="number" name="year_ended" min="1900" max="2099">
    </label>
    <label>Issue count (known)
      <input type="number" name="issue_count_known" min="1">
    </label>
  </div>

  <div class="form-row">
    <label>Type
      <input type="text" name="type" list="type-options" placeholder="newsstand, dirt_sheet…">
      <datalist id="type-options">
        {% for t in types %}<option value="{{ t }}">{% endfor %}
      </datalist>
    </label>
    <label>Parent company
      <input type="text" name="parent_company">
    </label>
    <label>Confidence
      <select name="confidence">
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
        <option value="low">low</option>
      </select>
    </label>
  </div>

  <label class="check">
    <input type="checkbox" name="archive_in_collection" value="1">
    I have issues in my archive
  </label>

  <label>Source URL
    <input type="url" name="source_url">
  </label>

  <label>Notes
    <textarea name="notes" rows="3"></textarea>
  </label>

  <div class="form-actions">
    <button type="submit">Save periodical</button>
    <a class="clear" href="{{ url_for('periodicals') }}">Cancel</a>
  </div>
</form>

{% endblock %}
