{% extends "base.html" %}
{% block title %}Add a territory run — Pro Wrestling Bibliography{% endblock %}
{% block content %}

<p class="breadcrumbs"><a href="{{ url_for('add_index') }}">&laquo; Add</a></p>

<h1>Add a wrestler-territory run</h1>
<p class="subtitle">Records a stretch when a wrestler worked a specific territory.</p>

<form class="add-form" method="post" action="{{ url_for('add_run') }}">
  <div class="form-row">
    <label>Wrestler <span class="req">*</span>
      <select name="wrestler_id" required>
        <option value="">— select wrestler —</option>
        {% for w in wrestlers_list %}
          <option value="{{ w['id'] }}" {% if preselect_wrestler == w['id'] %}selected{% endif %}>{{ w['primary_ring_name'] }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Territory <span class="req">*</span>
      <select name="territory_id" required>
        <option value="">— select territory —</option>
        {% for t in territories_list %}
          <option value="{{ t['id'] }}" {% if preselect_territory == t['id'] %}selected{% endif %}>{{ t['name'] }}{% if t['short_name'] %} ({{ t['short_name'] }}){% endif %}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="form-row">
    <label>Start year
      <input type="number" name="start_year" min="1900" max="2099">
    </label>
    <label>Start month
      <input type="number" name="start_month" min="1" max="12">
    </label>
    <label>End year
      <input type="number" name="end_year" min="1900" max="2099">
    </label>
    <label>End month
      <input type="number" name="end_month" min="1" max="12">
    </label>
  </div>

  <div class="form-row">
    <label>Role during run
      <input type="text" name="role_during_run" placeholder="main event, mid, enhancement, manager…">
    </label>
    <label>Ring name during run
      <input type="text" name="ring_name_during_run" placeholder="leave blank if same as primary">
    </label>
    <label class="check">
      <input type="checkbox" name="primary_run" value="1">
      Primary run for this wrestler
    </label>
  </div>

  <label>Notes
    <textarea name="notes" rows="3"></textarea>
  </label>

  <div class="form-actions">
    <button type="submit">Save run</button>
    <a class="clear" href="{{ url_for('add_index') }}">Cancel</a>
  </div>
</form>

{% endblock %}
