{% extends "base.html" %}
{% block title %}Add a book — Pro Wrestling Bibliography{% endblock %}
{% block content %}

<p class="breadcrumbs"><a href="{{ url_for('add_index') }}">&laquo; Add</a></p>

<h1>Add a book</h1>

<form class="add-form" method="post" action="{{ url_for('add_book') }}">
  <div class="form-row">
    <label>Title <span class="req">*</span>
      <input type="text" name="title" required autofocus>
    </label>
    <label>Subtitle
      <input type="text" name="subtitle">
    </label>
  </div>

  <div class="form-row">
    <label>Category <span class="req">*</span>
      <select name="category_code" required>
        {% for code, label in categories %}
          <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Confidence
      <select name="confidence">
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
        <option value="low">low</option>
        <option value="low_searched">low_searched</option>
      </select>
    </label>
  </div>

  <div class="form-row">
    <label class="grow">Author(s) — comma-separated; will be created if new
      <input type="text" name="authors" placeholder="e.g., Mick Foley, Larry Sweeney">
    </label>
    <label class="check">
      <input type="checkbox" name="authors_are_wrestlers" value="1">
      Author(s) are wrestlers
    </label>
  </div>

  <div class="form-row">
    <label>Publisher
      <input type="text" name="publisher">
    </label>
    <label>Year
      <input type="number" name="year_published" min="1900" max="2099">
    </label>
    <label>Pages
      <input type="number" name="pages" min="1">
    </label>
  </div>

  <div class="form-row">
    <label>ISBN-10
      <input type="text" name="isbn10">
    </label>
    <label>ISBN-13
      <input type="text" name="isbn13">
    </label>
    <label>Format
      <input type="text" name="format" placeholder="hardcover, paperback, ebook…">
    </label>
  </div>

  <div class="form-row">
    <label>Language
      <input type="text" name="language" value="English">
    </label>
    <label>Country
      <input type="text" name="country" list="country-options" placeholder="US, UK, Japan…">
      <datalist id="country-options">
        {% for c in countries %}<option value="{{ c }}">{% endfor %}
      </datalist>
    </label>
    <label>Era
      <input type="text" name="era" list="era-options" placeholder="territorial, attitude…">
      <datalist id="era-options">
        {% for e in eras %}<option value="{{ e }}">{% endfor %}
      </datalist>
    </label>
  </div>

  <div class="form-row">
    <label>Subject wrestler (if biography)
      <input type="text" name="subject_wrestler">
    </label>
    <label>Territory / promotion
      <input type="text" name="territory_or_promotion">
    </label>
  </div>

  <label>Synopsis
    <textarea name="synopsis" rows="4"></textarea>
  </label>

  <label>Source URL
    <input type="url" name="source_url" placeholder="https://…">
  </label>

  <div class="form-actions">
    <button type="submit">Save book</button>
    <a class="clear" href="{{ url_for('books') }}">Cancel</a>
  </div>
</form>

{% endblock %}
